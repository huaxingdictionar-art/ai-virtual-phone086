name: Apply per-character TTS speed patch

on:
  push:
    branches:
      - feature/per-character-tts-speed

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/per-character-tts-speed
          fetch-depth: 0
      - name: Patch source files
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Anchor not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "lib/settings-types.ts",
              "    languageBoost?: string;\n    customVoices?: { id: string; name: string; createdAt?: number }[];",
              "    languageBoost?: string;\n    /** Minimax voice_setting.speed. Missing values keep the legacy 1.0x behavior. */\n    speechSpeed?: number;\n    customVoices?: { id: string; name: string; createdAt?: number }[];",
          )

          replace_once(
              "lib/tts-service.ts",
              "const MINIMAX_EMOTIONS = new Set([\n    \"happy\", \"sad\", \"angry\", \"fearful\", \"disgusted\", \"surprised\", \"calm\", \"neutral\", \"fluent\",\n]);\n\nasync function synthesizeMinimax",
              "const MINIMAX_EMOTIONS = new Set([\n    \"happy\", \"sad\", \"angry\", \"fearful\", \"disgusted\", \"surprised\", \"calm\", \"neutral\", \"fluent\",\n]);\n\nconst MINIMAX_SPEED_MIN = 0.5;\nconst MINIMAX_SPEED_MAX = 2.0;\n\nfunction normalizeMinimaxSpeed(speed: number | undefined): number {\n    if (typeof speed !== \"number\" || !Number.isFinite(speed)) return 1.0;\n    return Math.min(MINIMAX_SPEED_MAX, Math.max(MINIMAX_SPEED_MIN, speed));\n}\n\nasync function synthesizeMinimax",
          )
          replace_once(
              "lib/tts-service.ts",
              "        speed: 1.0,\n        vol: 1.0,",
              "        speed: normalizeMinimaxSpeed(config.speechSpeed),\n        vol: 1.0,",
          )

          replace_once(
              "components/settings/voice-settings.tsx",
              "const GLOBAL_MINIMAX_BASE_URL = MINIMAX_BASE_URL_OPTIONS[1].baseUrl;\nconst VOICE_PROVIDER_OPTIONS",
              "const GLOBAL_MINIMAX_BASE_URL = MINIMAX_BASE_URL_OPTIONS[1].baseUrl;\nconst MINIMAX_SPEED_MIN = 0.5;\nconst MINIMAX_SPEED_MAX = 2.0;\nconst MINIMAX_SPEED_STEP = 0.1;\nconst DEFAULT_SPEECH_SPEED = 1.0;\nconst VOICE_PROVIDER_OPTIONS",
          )
          replace_once(
              "components/settings/voice-settings.tsx",
              "        defaultVoice: \"male-qn-qingse\",\n        enableSTT: true,",
              "        defaultVoice: \"male-qn-qingse\",\n        speechSpeed: DEFAULT_SPEECH_SPEED,\n        enableSTT: true,",
          )
          replace_once(
              "components/settings/voice-settings.tsx",
              "            return { ...config, baseUrl };",
              "            const speechSpeed = typeof config.speechSpeed === \"number\" && Number.isFinite(config.speechSpeed)\n                ? Math.min(MINIMAX_SPEED_MAX, Math.max(MINIMAX_SPEED_MIN, config.speechSpeed))\n                : DEFAULT_SPEECH_SPEED;\n            return { ...config, baseUrl, speechSpeed };",
          )
          replace_once(
              "components/settings/voice-settings.tsx",
              "            defaultVoice: \"male-qn-qingse\",\n            enableSTT: true,",
              "            defaultVoice: \"male-qn-qingse\",\n            speechSpeed: DEFAULT_SPEECH_SPEED,\n            enableSTT: true,",
          )
          replace_once(
              "components/settings/voice-settings.tsx",
              "            defaultVoice: wasMinimax ? (current?.defaultVoice || \"male-qn-qingse\") : \"male-qn-qingse\",\n        });",
              "            defaultVoice: wasMinimax ? (current?.defaultVoice || \"male-qn-qingse\") : \"male-qn-qingse\",\n            speechSpeed: wasMinimax ? (current?.speechSpeed ?? DEFAULT_SPEECH_SPEED) : DEFAULT_SPEECH_SPEED,\n        });",
          )
          replace_once(
              "components/settings/voice-settings.tsx",
              "                                                <div className=\"flex flex-col gap-1\">\n                                                    <label className=\"menu-desc ml-1\">语音模型 (TTS Model)</label>",
              "                                                <div className=\"flex flex-col gap-1\">\n                                                    <div className=\"flex items-center justify-between px-1\">\n                                                        <label className=\"menu-desc\">语速</label>\n                                                        <span className=\"menu-label font-medium\">{(config.speechSpeed ?? DEFAULT_SPEECH_SPEED).toFixed(1)}×</span>\n                                                    </div>\n                                                    <input\n                                                        type=\"range\"\n                                                        min={MINIMAX_SPEED_MIN}\n                                                        max={MINIMAX_SPEED_MAX}\n                                                        step={MINIMAX_SPEED_STEP}\n                                                        value={config.speechSpeed ?? DEFAULT_SPEECH_SPEED}\n                                                        onChange={(e) => updateConfig(config.id, { speechSpeed: Number(e.target.value) })}\n                                                        className=\"w-full accent-black\"\n                                                        aria-label=\"Minimax 语速\"\n                                                    />\n                                                    <div className=\"menu-desc flex justify-between px-1\">\n                                                        <span>{MINIMAX_SPEED_MIN.toFixed(1)}×</span>\n                                                        <span>默认 1.0×</span>\n                                                        <span>{MINIMAX_SPEED_MAX.toFixed(1)}×</span>\n                                                    </div>\n                                                </div>\n                                                <div className=\"flex flex-col gap-1\">\n                                                    <label className=\"menu-desc ml-1\">语音模型 (TTS Model)</label>",
          )

          workflow = Path(".github/workflows/apply-per-character-tts-speed.yml")
          workflow.unlink()
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/settings-types.ts lib/tts-service.ts components/settings/voice-settings.tsx .github/workflows/apply-per-character-tts-speed.yml
          git commit -m "增加按语音配置保存的 Minimax 语速调节"
          git push origin HEAD:feature/per-character-tts-speed
