name: Fix TTS speed scale labels

on:
  push:
    branches:
      - fix/tts-speed-scale-labels

permissions:
  contents: write

jobs:
  fix-labels:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/tts-speed-scale-labels
          fetch-depth: 0

      - name: Improve speed scale labels
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("components/settings/voice-settings.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''                                                    <div className="menu-desc flex justify-between px-1">
                                                        <span>{MINIMAX_SPEED_MIN.toFixed(1)}×</span>
                                                        <span>默认 1.0×</span>
                                                        <span>{MINIMAX_SPEED_MAX.toFixed(1)}×</span>
                                                    </div>'''
          new = '''                                                    <div className="relative mt-1 h-5 px-1 text-xs text-gray-500" aria-hidden="true">
                                                        <span className="absolute left-1 whitespace-nowrap">{MINIMAX_SPEED_MIN.toFixed(1)}×</span>
                                                        <span className="absolute whitespace-nowrap" style={{ left: "33.333%", transform: "translateX(-50%)" }}>1.0× 默认</span>
                                                        <span className="absolute right-1 whitespace-nowrap">{MINIMAX_SPEED_MAX.toFixed(1)}×</span>
                                                    </div>'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one old label block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-tts-speed-scale-labels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/settings/voice-settings.tsx .github/workflows/fix-tts-speed-scale-labels.yml
          git commit -m "优化语速滑块刻度排版"
          git push origin fix/tts-speed-scale-labels
