name: Fix Minimax speed slider placement

on:
  push:
    branches:
      - fix/minimax-speed-slider-placement

permissions:
  contents: write

jobs:
  fix-placement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/minimax-speed-slider-placement
          fetch-depth: 0

      - name: Move slider to Minimax section
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("components/settings/voice-settings.tsx")
          text = path.read_text(encoding="utf-8")

          start_marker = '                                                <div className="flex flex-col gap-1">\n                                                    <div className="flex items-center justify-between px-1">\n                                                        <label className="menu-desc">语速</label>'
          end_marker = '                                                </div>\n                                                <div className="flex flex-col gap-1">\n                                                    <label className="menu-desc ml-1">语音模型 (TTS Model)</label>'

          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("Speed slider start marker not found")

          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("Speed slider end marker not found")

          slider = text[start:end + len('                                                </div>\n')]
          text = text[:start] + text[end + len('                                                </div>\n'):]

          minimax_marker = '                                        {config.provider === "Minimax" && (\n                                            <>\n'
          if text.count(minimax_marker) != 1:
              raise SystemExit("Minimax section marker not unique")

          text = text.replace(minimax_marker, minimax_marker + slider, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-minimax-speed-slider-placement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/settings/voice-settings.tsx .github/workflows/fix-minimax-speed-slider-placement.yml
          git commit -m "修复 Minimax 语速滑块显示位置"
          git push origin fix/minimax-speed-slider-placement
